command: eval-e2e
run: {name: e2e-paper}
retrieval: {backend: dense, table_encoding: table_retrieval_text}
embedding: {backend: sentence_transformers, model_id: Qwen/Qwen3-Embedding-8B, adapter: auto, device: auto, batch_size: 8, max_tokens: 1024, normalize: true, cache: disk}
reranker: {enabled: true, backend: cross_encoder, model_id: Qwen/Qwen3-Reranker-8B, adapter: auto, top_n: 500, batch_size: 4, max_tokens: 1024, instruction: financial_table_v1}
answering: {context: retrieved, strategy: pandas_query, retrieval_k: 10, max_context_tables: 10, table_max_chars: 20000}
prompt: {system: prompts/answering/program_system.txt, user_template: prompts/answering/common_user.txt}
llm: {backend: openai_compatible, base_url_env: OPENAI_URL, api_key_env: OPENAI_API_KEY, model_id: openai/gpt-5.4-thinking, temperature: 0, max_completion_tokens: 8192, max_retries: 0, reasoning_effort: high}
evaluation: {e2e_ks: [10], limit: 1012, workers: 1, answer_abs_tolerance: 0.01}
