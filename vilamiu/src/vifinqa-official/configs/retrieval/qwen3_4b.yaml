command: eval-retrieval
run: {name: retrieval-qwen3-4b-paper}
retrieval: {backend: dense, table_encoding: table_retrieval_text}
embedding: {backend: sentence_transformers, model_id: Qwen/Qwen3-Embedding-4B, adapter: auto, device: auto, batch_size: 8, max_tokens: 1024, normalize: true, cache: disk}
reranker: {enabled: false, backend: none}
evaluation: {mode: full, ks: [1, 3, 5, 10, 20, 50, 100], limit: 1012}
