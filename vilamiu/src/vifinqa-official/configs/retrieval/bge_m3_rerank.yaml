command: eval-retrieval
run: {name: retrieval-bge-m3-rerank-paper}
retrieval: {backend: dense, table_encoding: table_retrieval_text}
embedding: {backend: sentence_transformers, model_id: BAAI/bge-m3, adapter: auto, device: auto, batch_size: 8, max_tokens: 1024, normalize: true, cache: disk}
reranker: {enabled: true, backend: cross_encoder, model_id: BAAI/bge-reranker-v2-m3, adapter: auto, top_n: 500, batch_size: 4, max_tokens: 1024}
evaluation: {mode: full, ks: [1, 3, 5, 10, 20, 50, 100], limit: 1012}
